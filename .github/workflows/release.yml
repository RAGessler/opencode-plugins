name: Release OpenCode V2 plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Validate release tag
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v${package_version}" = "${GITHUB_REF_NAME}" || {
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          }
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - name: Pack npm release
        run: mkdir -p dist && npm pack --pack-destination dist
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN}" || {
            echo "Set the NPM_TOKEN repository secret before publishing a release." >&2
            exit 1
          }
          npm publish dist/*.tgz --access public --provenance --registry=https://registry.npmjs.org
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            OpenCode V2 TUI cost plugin. Install the npm package in the global OpenCode `cli.json` plugins array as documented in the README.

            The legacy Python TUI is deprecated and OpenCode V1-only. No further Python wheel releases will be published; existing releases remain available.
          files: dist/*.tgz
          draft: false
          prerelease: false
