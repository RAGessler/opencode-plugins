name: Release plugin

# Each package has its own tag: costs-v<version> or pr-followup-v<version>.
on:
  push:
    tags:
      - "costs-v*"
      - "pr-followup-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Resolve package and validate tag
        id: pkg
        run: |
          case "${GITHUB_REF_NAME}" in
            costs-v*) dir=costs; version="${GITHUB_REF_NAME#costs-v}" ;;
            pr-followup-v*) dir=pr-followup; version="${GITHUB_REF_NAME#pr-followup-v}" ;;
            *) echo "Unknown tag ${GITHUB_REF_NAME}." >&2; exit 1 ;;
          esac
          package_version=$(node -p "require('./packages/${dir}/package.json').version")
          test "${version}" = "${package_version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          }
          echo "dir=packages/${dir}" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - name: Pack npm release
        run: mkdir -p dist && npm pack --workspace "${{ steps.pkg.outputs.dir }}" --pack-destination dist
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "${NODE_AUTH_TOKEN}" || {
            echo "Set the NPM_TOKEN repository secret before publishing a release." >&2
            exit 1
          }
          npm publish dist/*.tgz --access public --provenance --registry=https://registry.npmjs.org
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.tgz
          draft: false
          prerelease: false
